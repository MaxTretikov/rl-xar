<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="770" viewBox="0 0 1250 770" role="img" aria-labelledby="title desc">
  <title id="title">Rubric guided writer improvement</title>
  <desc id="desc">A writer generates responses using updated weights. An inference only shared model creates rubric criteria and separately evaluates writer and expert responses with the same rubric. Expert-minus-writer score differences and examples where the writer ties or beats the expert inform rubric instruction revisions; the writer score supplies the GRPO reward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
    <style>
      text{font-family:"Noto Sans",sans-serif;fill:#172033}.role{font-size:24px;font-weight:750}.group{font-size:20px;font-weight:750}.body{font-size:18px}.small{font-size:16px}.badge{font-size:15px;font-weight:800;letter-spacing:.35px}.muted{fill:#475569}.line{fill:none;stroke:#334155;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.blueLine{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blue)}.amberLine{fill:none;stroke:#b45309;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#amber)}
    </style>
  </defs>
  <rect width="1250" height="770" fill="#fff"/>

  <rect x="40" y="30" width="1170" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="68" y="70" class="group">Example dataset</text>
  <text x="68" y="101" class="body muted">Context + expert responses</text>

  <rect x="420" y="155" width="790" height="540" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="198" class="group">Inference only</text>

  <rect x="475" y="260" width="315" height="145" rx="14" fill="#fff" stroke="#64748b" stroke-width="1.7"/>
  <text x="500" y="307" class="role">Rubric author</text>
  <text x="500" y="350" class="body muted">Create scoring criteria</text>

  <rect x="895" y="260" width="275" height="145" rx="14" fill="#fff" stroke="#64748b" stroke-width="1.7"/>
  <text x="920" y="307" class="role">Instruction editor</text>
  <text x="920" y="346" class="small muted">Find missed expert qualities</text>
  <text x="920" y="374" class="small muted">Revise rubric instructions</text>

  <rect x="650" y="510" width="405" height="145" rx="14" fill="#fff" stroke="#64748b" stroke-width="1.7"/>
  <text x="675" y="557" class="role">Quality scorer</text>
  <text x="675" y="590" class="small muted">Same rubric · separate scores</text>
  <rect x="675" y="608" width="155" height="30" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="752" y="629" text-anchor="middle" class="small" fill="#1d4ed8">Writer score</text>
  <rect x="850" y="608" width="155" height="30" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="927" y="629" text-anchor="middle" class="small" fill="#92400e">Expert score</text>

  <rect x="55" y="430" width="310" height="220" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="480" class="role">Writer</text>
  <rect x="82" y="515" width="256" height="38" rx="19" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="210" y="540" text-anchor="middle" class="badge" fill="#1e3a8a">UPDATED WEIGHTS</text>
  <text x="82" y="596" class="body muted">Full fine-tuning or PEFT</text>

  <!-- Context feeds writer, author, and scorer -->
  <path d="M210 130V190H450V332H475" class="line"/>
  <path d="M210 190V430" class="line"/>
  <path d="M450 332V455H675V510" class="line"/>
  <text x="300" y="178" class="small muted">Context</text>
  <text x="500" y="445" class="small muted">Context</text>

  <!-- Expert responses feed scoring only -->
  <path d="M1210 80H1225V600H1055" class="amberLine"/>
  <text x="1070" y="583" class="small" fill="#92400e">Expert responses</text>

  <!-- Main role flows -->
  <path d="M632 405V435H852V510" class="line"/>
  <text x="750" y="423" class="small muted">Rubric</text>
  <path d="M365 535H650" class="blueLine"/>
  <text x="472" y="520" class="small" fill="#1d4ed8">Responses</text>
  <path d="M940 510V405" class="amberLine"/>
  <text x="955" y="448" class="small" fill="#92400e">Expert score − writer score</text>
  <text x="955" y="476" class="small" fill="#92400e">Examples where writer ≥ expert</text>
  <path d="M1032 260V225H632V260" class="line"/>
  <text x="725" y="213" class="small" fill="#1d4ed8">Revised instructions</text>

  <!-- Reward feedback updates writer weights -->
  <path d="M650 620H560V735H210V650" class="blueLine" stroke-dasharray="9 7"/>
  <text x="365" y="720" class="small" fill="#92400e">Writer score → GRPO</text>
</svg>

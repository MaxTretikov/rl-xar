<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">rlxar RL-XAR architecture</title>
  <desc id="desc">Four model nodes show the writer policy, rubric generator, judge, and meta-prompt reviser. Context and expert data flow through rubric generation and paired judging. Judge scores become GRPO rewards; gradients update only the writer's LoRA adapter. Rubric prompts are selected on validation data before held-out test evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b71c1c"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263238; }
      .model { stroke-width: 2.5; }
      .model-title { font-size: 22px; font-weight: 700; }
      .model-subtitle { font-size: 14px; font-weight: 600; }
      .model-copy { font-size: 14px; }
      .muted { fill: #546e7a; font-size: 13px; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 12px; }
      .callout { fill: #fff; stroke: #90a4ae; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .callout-title { font-size: 15px; font-weight: 700; }
      .flow { fill: none; stroke: #263238; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #1565c0; stroke-width: 2.2; stroke-dasharray: 6 4; marker-end: url(#arrow-blue); }
      .flow-red { fill: none; stroke: #b71c1c; stroke-width: 2.6; stroke-dasharray: 8 5; marker-end: url(#arrow-red); }
      .pill { fill: #eceff1; stroke: #90a4ae; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1120" fill="#fafbfc"/>
  <text x="750" y="42" text-anchor="middle" font-size="30" font-weight="750">RL-XAR in rlxar</text>
  <text x="750" y="68" text-anchor="middle" class="muted">Solid cards are models. Dashed cards are data or orchestration callouts.</text>

  <!-- Model nodes: the only architecture nodes. -->
  <g id="writer-policy">
    <rect x="65" y="230" width="330" height="245" rx="14" fill="#e8f5e9" stroke="#2e7d32" class="model"/>
    <text x="230" y="268" text-anchor="middle" class="model-title">Writer policy</text>
    <text x="230" y="294" text-anchor="middle" class="model-subtitle">local Hugging Face causal LM</text>
    <line x1="92" y1="313" x2="368" y2="313" stroke="#81c784"/>
    <text x="92" y="341" class="model-copy">Base weights: frozen</text>
    <text x="92" y="367" class="model-copy" font-weight="700">LoRA adapter: trainable</text>
    <text x="92" y="393" class="model-copy">GRPO updates adapter only</text>
    <text x="92" y="428" class="muted">Needs local weights and gradients.</text>
    <text x="92" y="450" class="muted">Can resume from the previous round.</text>
  </g>

  <g id="rubric-generator">
    <rect x="530" y="150" width="400" height="190" rx="14" fill="#ede7f6" stroke="#6a1b9a" class="model"/>
    <text x="730" y="188" text-anchor="middle" class="model-title">Rubric generator</text>
    <text x="730" y="214" text-anchor="middle" class="model-subtitle">inference-only LiteLLM chat model</text>
    <line x1="557" y1="233" x2="903" y2="233" stroke="#ba68c8"/>
    <text x="557" y="261" class="model-copy">context + meta-prompt → rubric JSON</text>
    <text x="557" y="287" class="model-copy">3–5 criteria; weights sum to 1</text>
    <text x="557" y="319" class="muted">Context only: never sees expert or candidate.</text>
  </g>

  <g id="judge">
    <rect x="530" y="500" width="400" height="220" rx="14" fill="#ede7f6" stroke="#6a1b9a" class="model"/>
    <text x="730" y="538" text-anchor="middle" class="model-title">Judge</text>
    <text x="730" y="564" text-anchor="middle" class="model-subtitle">inference-only LiteLLM chat model</text>
    <line x1="557" y1="583" x2="903" y2="583" stroke="#ba68c8"/>
    <text x="557" y="611" class="model-copy">context + rubric + one response</text>
    <text x="557" y="637" class="model-copy">→ score [0,1] for each criterion</text>
    <text x="557" y="663" class="model-copy">local weighted total → reward</text>
    <text x="557" y="699" class="muted">Scores expert and candidate with the same rubric.</text>
  </g>

  <g id="meta-prompt-reviser">
    <rect x="1065" y="150" width="370" height="205" rx="14" fill="#ede7f6" stroke="#6a1b9a" class="model"/>
    <text x="1250" y="188" text-anchor="middle" class="model-title">Meta-prompt reviser</text>
    <text x="1250" y="214" text-anchor="middle" class="model-subtitle">inference-only LiteLLM chat model</text>
    <line x1="1092" y1="233" x2="1408" y2="233" stroke="#ba68c8"/>
    <text x="1092" y="261" class="model-copy">current prompt + train gap</text>
    <text x="1092" y="287" class="model-copy">+ up to 30 rubric failures</text>
    <text x="1092" y="313" class="model-copy">→ revised rubric instructions</text>
    <text x="1092" y="341" class="muted">Closed-source models are valid here.</text>
  </g>

  <!-- Data and orchestration callouts. -->
  <g id="dataset-callout">
    <rect x="65" y="92" width="330" height="105" rx="10" class="callout"/>
    <text x="82" y="118" class="callout-title">Dataset JSONL</text>
    <text x="82" y="143" class="small">context, expert, id, group_id, split</text>
    <text x="82" y="166" class="small">train / validation / test</text>
    <text x="82" y="186" class="muted">group_id stays in one split</text>
  </g>

  <g id="prompt-callout">
    <rect x="1065" y="78" width="370" height="50" rx="10" class="pill"/>
    <text x="1250" y="109" text-anchor="middle" class="label">meta-prompt (default, then revised)</text>
  </g>

  <g id="grpo-callout">
    <rect x="65" y="560" width="330" height="190" rx="10" class="callout"/>
    <text x="82" y="588" class="callout-title">GRPO training (TRL)</text>
    <text x="82" y="614" class="small">For each train context:</text>
    <text x="98" y="637" class="small">G ≥ 2 sampled completions</text>
    <text x="98" y="658" class="small">judge total for each completion</text>
    <text x="98" y="679" class="small">group-relative advantage</text>
    <text x="98" y="700" class="small">policy loss → LoRA gradients</text>
    <text x="82" y="730" class="muted">One adapter is carried round to round.</text>
  </g>

  <g id="selection-callout">
    <rect x="1065" y="430" width="370" height="165" rx="10" class="callout"/>
    <text x="1082" y="458" class="callout-title">Prompt selection</text>
    <text x="1082" y="485" class="small">Each candidate prompt is scored on</text>
    <text x="1082" y="506" class="small">validation expert − policy gap.</text>
    <text x="1082" y="535" class="small">Keep the prompt with the largest</text>
    <text x="1082" y="556" class="small">mean validation gap for this round.</text>
    <text x="1082" y="582" class="muted">Train failures drive revisions.</text>
  </g>

  <g id="test-callout">
    <rect x="530" y="845" width="905" height="170" rx="10" class="callout"/>
    <text x="552" y="875" class="callout-title">Held-out test evaluation after the final round</text>
    <text x="552" y="903" class="small">Final writer + test context → continuation; each selected meta-prompt generates a fresh context-only rubric.</text>
    <text x="552" y="929" class="small">The judge scores expert and policy with that same rubric → expert gap and policy/expert normalized score.</text>
    <text x="552" y="965" class="muted">Test examples never participate in prompt optimization or policy training.</text>
  </g>

  <!-- Forward data flow. -->
  <path d="M230 197 V230" class="flow"/>
  <text x="244" y="219" class="label">context</text>

  <path d="M395 143 H500 V245 H530" class="flow"/>
  <text x="419" y="133" class="label">context only</text>

  <path d="M1250 128 V150" class="flow"/>
  <text x="1264" y="142" class="label">instructions</text>

  <path d="M730 340 V500" class="flow"/>
  <text x="748" y="420" class="label">rubric JSON</text>

  <path d="M395 350 H500 V585 H530" class="flow"/>
  <text x="408" y="337" class="label">candidate</text>

  <path d="M395 165 C455 165 470 625 530 625" class="flow"/>
  <text x="424" y="401" class="label">expert</text>

  <path d="M930 610 H1010 V505 H1065" class="flow-blue"/>
  <text x="970" y="597" class="label" fill="#1565c0">validation gap</text>

  <path d="M930 650 H1035 V325 H1065" class="flow-blue"/>
  <text x="975" y="637" class="label" fill="#1565c0">train failures + gap</text>

  <path d="M1065 300 H980 V245 H930" class="flow-blue"/>
  <text x="997" y="233" text-anchor="middle" class="label" fill="#1565c0">revised prompt</text>

  <path d="M1065 530 H1000 V270 H930" class="flow-blue"/>
  <text x="1010" y="385" class="label" fill="#1565c0">best validation prompt</text>

  <path d="M1065 103 H980 V180 H930" class="flow-blue"/>
  <text x="990" y="166" class="label" fill="#1565c0">current prompt</text>

  <!-- Reward and backprop path. -->
  <path d="M530 680 H440 V655 H395" class="flow"/>
  <text x="463" y="642" text-anchor="middle" class="label">scalar reward</text>

  <path d="M395 440 H430 V620 H395" class="flow"/>
  <text x="465" y="528" text-anchor="middle" class="label">G samples</text>

  <path d="M230 560 V475" class="flow-red"/>
  <text x="247" y="520" class="label" fill="#b71c1c">∇ policy loss</text>
  <text x="247" y="540" class="small" fill="#b71c1c">LoRA only</text>

  <!-- Held-out test route, intentionally below training loop. -->
  <path d="M395 430 C445 780 480 865 530 900" class="flow"/>
  <text x="414" y="790" class="label">final test rollout</text>
  <path d="M930 680 C1040 760 1110 845 1125 845" class="flow"/>
  <text x="972" y="770" class="label">expert/candidate scores</text>

  <!-- Legend and model availability. -->
  <g id="legend">
    <rect x="65" y="845" width="395" height="195" rx="10" fill="#fff" stroke="#90a4ae"/>
    <text x="85" y="875" class="callout-title">Model availability</text>
    <rect x="85" y="892" width="18" height="18" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="115" y="906" class="small">Writer: local/open weights; gradients required</text>
    <rect x="85" y="922" width="18" height="18" rx="3" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
    <text x="115" y="936" class="small">Chat roles: inference only; closed APIs allowed</text>
    <line x1="85" y1="963" x2="110" y2="963" class="flow"/>
    <text x="115" y="967" class="small">forward / API call</text>
    <line x1="255" y1="963" x2="280" y2="963" class="flow-red"/>
    <text x="285" y="967" class="small">backpropagation</text>
    <line x1="85" y1="992" x2="110" y2="992" class="flow-blue"/>
    <text x="115" y="996" class="small">prompt revision / selection</text>
    <text x="85" y="1024" class="muted">Three purple roles share one configured LiteLLM model.</text>
  </g>
</svg>
